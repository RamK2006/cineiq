global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cineiq-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8001'] # Use 'backend:8001' if running in same docker network
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'cineiq-backend'
